<!DOCTYPE html>
<html><head><meta charset="utf-8">
<!-- Abertura e cartela final para stories da Megha (preto, vermelho e branco, com a logo).
     Parâmetros: modo ("abertura" | "final"), variante ("a" | "b" | "c"), linha1, grande, linha2,
     selo (texto da pílula vermelha), duracao. Fundo: preto brilhante com brilho vermelho e feixe de luz. -->
<style>
/*__FONTES__*/
html,body{margin:0;background:transparent;overflow:hidden;width:100vw;height:100vh}
#tela{position:absolute;inset:0;overflow:hidden;
  background:
   radial-gradient(70% 38% at 50% 44%, rgba(225,20,20,.42) 0%, rgba(120,0,0,.22) 45%, rgba(0,0,0,0) 75%),
   radial-gradient(120% 50% at 50% 112%, rgba(200,10,10,.55) 0%, rgba(60,0,0,.2) 45%, rgba(0,0,0,0) 70%),
   linear-gradient(180deg,#070707 0%,#0D0D0D 50%,#140606 100%)}
#chao{position:absolute;left:-20%;right:-20%;bottom:-2%;height:30%;
  background:repeating-linear-gradient(90deg, rgba(255,255,255,.035) 0 2px, rgba(0,0,0,0) 2px 7%);
  transform:perspective(600px) rotateX(62deg);transform-origin:bottom;opacity:.7}
#feixe{position:absolute;left:0;right:0;height:.45%;
  background:linear-gradient(90deg,rgba(255,40,40,0),rgba(255,90,90,.9) 45%,#fff 50%,rgba(255,90,90,.9) 55%,rgba(255,40,40,0));
  box-shadow:0 0 30px 8px rgba(255,30,30,.55);filter:blur(1px)}
#reflexo{position:absolute;top:-30%;bottom:-30%;width:26%;
  background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.10),rgba(255,255,255,0));transform:skewX(-18deg)}
#logo{position:absolute;left:50%;width:calc(var(--u)*74);transform-origin:center}
#txt{position:absolute;left:0;right:0;text-align:center;color:#fff}
#l1{font-family:"Montserrat Alternates",sans-serif;font-weight:300;font-size:calc(var(--u)*6.2);letter-spacing:-.05em}
#gr{font-family:"Poppins",sans-serif;font-weight:900;font-size:calc(var(--u)*19);line-height:.95;letter-spacing:-.03em;
  text-transform:uppercase;white-space:nowrap;filter:drop-shadow(0 0 calc(var(--u)*2.2) rgba(255,30,20,.55))}
#gr .letra{display:inline-block;color:transparent;-webkit-background-clip:text;background-clip:text;
  background-image:linear-gradient(100deg,#E3171B 0%,#E3171B 38%,#FFB0A8 45%,#FFFFFF 48%,#FF9A90 52%,#E3171B 60%,#E3171B 100%)}
#l2{font-family:"Poppins",sans-serif;font-weight:700;font-size:calc(var(--u)*5.4);letter-spacing:-.035em;text-transform:uppercase;margin-top:calc(var(--u)*1.2)}
#selo{display:inline-block;margin-top:calc(var(--u)*3.2);padding:calc(var(--u)*1.5) calc(var(--u)*4.4);border-radius:calc(var(--u)*1.6);
  background:#E3171B;color:#fff;font-family:"Poppins",sans-serif;font-weight:800;font-size:calc(var(--u)*4.6);letter-spacing:-.02em;
  box-shadow:0 0 calc(var(--u)*4) rgba(255,30,20,.45)}
</style></head><body>
<div id="tela"><div id="chao"></div><div id="reflexo"></div><div id="feixe"></div>
<img id="logo" src="__MARCA__/megha_logo.png">
<div id="txt"><div id="l1"></div><div id="gr"></div><div id="l2"></div><div><span id="selo"></span></div></div></div>
<script>window.PARAMS=/*__PARAMS__*/{};window.PADRAO={modo:"abertura",variante:"a",linha1:"sábado é dia de",grande:"oportunidade",linha2:"",selo:"",duracao:1.9};</script>
<script>/*__BASE__*/</script>
<script>
const P=M.P,W=innerWidth,H=innerHeight;
document.documentElement.style.setProperty('--u',(W/100)+'px');
const tela=document.getElementById('tela'),logo=document.getElementById('logo'),txt=document.getElementById('txt'),
      l1=document.getElementById('l1'),gr=document.getElementById('gr'),l2=document.getElementById('l2'),
      selo=document.getElementById('selo'),feixe=document.getElementById('feixe'),ref=document.getElementById('reflexo');
l1.textContent=P.linha1||''; l2.textContent=P.linha2||''; selo.textContent=P.selo||'';
if(!P.linha2) l2.style.display='none'; if(!P.selo) selo.parentNode.style.display='none';
const letras=[...(P.grande||'')].map(c=>{const s=document.createElement('span');s.className='letra';s.textContent=c===' '?' ':c;gr.appendChild(s);return s;});
const FINAL=P.modo==='final';
window.PRONTO=Promise.all([document.fonts.ready,new Promise(r=>{if(logo.complete)r();else logo.onload=r;})]).then(()=>{
  const larg=el=>{const r=document.createRange();r.selectNodeContents(el);return r.getBoundingClientRect().width;};
  const w=larg(gr); if(w>W*.9) gr.style.fontSize=(parseFloat(getComputedStyle(gr).fontSize)*W*.9/w)+'px';
  const ww=larg(gr), x0=letras.length?letras[0].offsetLeft:0;
  letras.forEach(s=>{s._x=s.offsetLeft-x0; s.style.backgroundSize=(ww*2.6)+'px 100%';}); gr._ww=ww;
  // posições: abertura = logo em cima, texto no centro; final = texto em cima, logo embaixo
  const lh=logo.getBoundingClientRect().height;
  logo.style.top=((FINAL?0.60:0.20)*H)+'px'; logo.style.marginLeft=(-logo.getBoundingClientRect().width/2)+'px';
  txt.style.top=((FINAL?0.30:0.47)*H)+'px';
  feixe.style.top=((FINAL?0.57:0.44)*H)+'px';
  renderFrame(0);});
window.renderFrame=t=>{
  const D=DURACAO, v=P.variante;
  const sai=FINAL?0:M.cubicIn(M.clamp((t-(D-.22))/.22));
  // entrada da tela
  if(FINAL){ const e=M.p(t,0,.35); tela.style.opacity=Math.min(1,e*1.5); tela.style.transform=`scale(${(1.06-.06*e).toFixed(4)})`; }
  else if(v==='b'){ const e=M.p(t,0,.32,M.inOut); tela.style.clipPath=`inset(0 ${((1-e)*100).toFixed(2)}% 0 0)`; }
  else if(v==='c'){ const e=M.p(t,0,.34,M.inOut); tela.style.clipPath=`circle(${(e*130).toFixed(2)}% at 50% 50%)`; }
  else { tela.style.opacity=Math.min(1,M.p(t,0,.18)*1.4); }
  tela.style.transform=(tela.style.transform||'')+'';
  if(!FINAL) tela.style.transform=`translateY(${(-sai*100).toFixed(2)}%)`;
  // feixe e reflexo
  const f=M.clamp((t-.08)/.55); feixe.style.opacity=Math.sin(f*Math.PI).toFixed(3); feixe.style.transform=`scaleX(${(.15+1.2*f).toFixed(3)})`;
  ref.style.left=(-40+170*M.clamp((t-.2)/(D*.8)))+'%';
  // logo
  const el=M.p(t,FINAL?.25:.08,.55), deriva=1+.03*t/D;
  logo.style.opacity=Math.min(1,el*1.6);
  logo.style.transform=`scale(${((v==='b'&&!FINAL?1.25-.25*el:.82+.18*el)*deriva).toFixed(4)})`;
  logo.style.filter=`blur(${((1-el)*8).toFixed(2)}px) drop-shadow(0 0 ${(18*el).toFixed(1)}px rgba(255,40,30,.55))`;
  // texto
  const t0=FINAL?.05:.28;
  const a1=M.p(t,t0,.4); l1.style.opacity=a1; l1.style.transform=`translateY(${((1-a1)*24).toFixed(1)}px)`;
  const n=letras.length;
  letras.forEach((s,i)=>{
    let e,tf;
    if(v==='b'){ e=M.p(t,t0+.08+i*.03,.3); tf=`translateY(${((1-e)*.6).toFixed(3)}em) scale(${(1.3-.3*e).toFixed(3)})`; }
    else if(v==='c'){ const k=((i*7919+13)%31)/31; e=M.p(t,t0+.06+k*.35,.25); tf=`scale(${(1.7-.7*e).toFixed(3)})`; }
    else { e=M.p(t,t0+.06+Math.abs(i-(n-1)/2)*.03,.45); tf=`translateX(${((i-(n-1)/2)*(1-e)*.35).toFixed(3)}em) rotateY(${((i%2?1:-1)*90*(1-e)).toFixed(1)}deg)`; }
    s.style.opacity=Math.min(1,e*1.8); s.style.transform=tf; s.style.filter=e<1?`blur(${((1-e)*6).toFixed(2)}px)`:'none';
  });
  const r=M.clamp((t-t0-.45)/.8), rr=1-Math.pow(1-r,3), S=gr._ww*2.6;
  letras.forEach(s=>{s.style.backgroundPosition=`${((gr._ww-S)*(1-rr)-s._x).toFixed(2)}px 0`;});
  const a2=M.p(t,t0+.4,.4); l2.style.opacity=a2; l2.style.transform=`translateY(${((1-a2)*20).toFixed(1)}px)`;
  const a3=M.p(t,t0+.6,.4); selo.style.opacity=a3; selo.style.transform=`scale(${(.8+.2*a3).toFixed(3)})`;
};
</script></body></html>
