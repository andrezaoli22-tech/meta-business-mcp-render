<title>Personal Chef Pro</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: trilho de navegação fixo à esquerda (o "passe" da cozinha) + folha de aula com largura de leitura; no celular o trilho vira menu. */
:root{
  --bg:#F3F6F2; --surface:#FFFFFF; --ink:#16201A; --muted:#56655C; --line:#D5DED7;
  --accent:#2E6A4E; --accent-ink:#FFFFFF; --accent-soft:#E1EEE6;
  --warn:#AF3F2A; --warn-soft:#F7E4DE; --ok:#2E6A4E; --ok-soft:#E1EEE6;
  --figure:#FFFFFF;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1512; --surface:#161E1A; --ink:#E4EBE6; --muted:#9BAAA1; --line:#2A3630;
  --accent:#7FC3A1; --accent-ink:#0D1411; --accent-soft:#1C2E25;
  --warn:#EE8B73; --warn-soft:#3A231D; --ok:#7FC3A1; --ok-soft:#1C2E25; --figure:#F4F6F4; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1512; --surface:#161E1A; --ink:#E4EBE6; --muted:#9BAAA1; --line:#2A3630;
  --accent:#7FC3A1; --accent-ink:#0D1411; --accent-soft:#1C2E25;
  --warn:#EE8B73; --warn-soft:#3A231D; --ok:#7FC3A1; --ok-soft:#1C2E25; --figure:#F4F6F4; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.6}
a{color:var(--accent);overflow-wrap:anywhere}
section p,section li,section td{overflow-wrap:break-word}
a:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.app{display:grid;grid-template-columns:300px minmax(0,1fr);min-height:100%}
.rail{position:sticky;top:env(safe-area-inset-top,0px);align-self:start;height:100vh;overflow:auto;border-right:1px solid var(--line);background:var(--surface);
  padding-block:24px 32px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:20px}
.brand{display:flex;flex-direction:column;gap:2px;margin-bottom:18px}
.brand b{font-family:var(--f-display);font-size:22px;letter-spacing:-.01em;line-height:1.15}
.brand span{font-size:14px;color:var(--muted)}
.progress{margin:0 0 20px;display:grid;gap:6px}
.progress-bar{height:8px;border-radius:99px;background:var(--accent-soft);overflow:hidden}
.progress-bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s}
.progress small{font-family:var(--f-mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.nav-group{margin-bottom:16px}
.nav-title{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
.nav-group ul{list-style:none;margin:0;padding:0;display:grid;gap:1px}
.nav-group a{display:flex;gap:8px;align-items:baseline;padding:5px 8px;border-radius:6px;text-decoration:none;color:var(--ink);font-size:15px;line-height:1.35}
.nav-group a:hover{background:var(--accent-soft)}
.nav-group a.active{background:var(--accent);color:var(--accent-ink)}
.nav-group a.lesson-link::before{content:"";flex:0 0 9px;height:9px;border-radius:50%;border:1.5px solid currentColor;opacity:.55;transform:translateY(1px)}
.nav-group a.lesson-link.is-done::before{background:currentColor;opacity:1}

.topbar{display:none}
main{min-width:0;padding-block:40px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
section{max-width:760px;margin:0 auto}
.eyebrow{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin:0 0 6px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;line-height:1.2;letter-spacing:-.01em}
h1{font-size:clamp(28px,4vw,38px);margin:0 0 14px}
h2{font-size:24px;margin:40px 0 10px;padding-top:14px;border-top:1px solid var(--line)}
h3{font-size:19px;margin:26px 0 8px}
p,li{max-width:68ch}
ul,ol{padding-left:1.3em}
li{margin:4px 0}
blockquote{margin:16px 0;padding:10px 16px;border-left:3px solid var(--accent);background:var(--accent-soft);border-radius:0 8px 8px 0}
blockquote p{margin:6px 0}
code{font-family:var(--f-mono);font-size:.85em;background:var(--accent-soft);padding:1px 5px;border-radius:4px}
pre{overflow-x:auto;background:var(--surface);border:1px dashed var(--line);border-radius:8px;padding:14px;font-size:14px}
pre code{background:none;padding:0}
hr{border:0;border-top:1px solid var(--line);margin:28px 0}

/* comanda da aula: o detalhe de cozinha */
.ticket{font-family:var(--f-mono);font-size:13px;display:inline-flex;flex-wrap:wrap;gap:4px 10px;padding:8px 14px;border:1.5px dashed var(--muted);border-radius:4px;background:var(--surface);max-width:100%}
.ticket strong{font-weight:600}

.table-wrap{overflow-x:auto;margin:14px 0;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:15px;line-height:1.45}
th,td{padding:8px 12px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
th{font-weight:700;background:var(--accent-soft)}
tr:last-child td{border-bottom:0}

.fig{margin:20px 0;background:var(--figure);border:1px solid var(--line);border-radius:10px;padding:12px;overflow-x:auto}
.fig svg{display:block;max-width:100%;height:auto;margin:0 auto}
.fig figcaption{font-size:13px;color:#4A5850;text-align:center;margin-top:6px}

li.check{list-style:none;margin-left:-1.3em;display:flex;gap:10px;align-items:flex-start}
li.check input{margin-top:6px;width:18px;height:18px;accent-color:var(--accent);flex:0 0 auto}

.answer-btn{font:inherit;font-size:14px;font-weight:600;color:var(--accent);background:var(--accent-soft);border:0;border-radius:6px;padding:3px 10px;cursor:pointer;margin:4px 0}
.answer{display:block;margin-top:4px;padding:8px 12px;border-radius:6px;background:var(--ok-soft)}

.done{display:flex;gap:10px;align-items:center;margin:32px 0 0;padding:14px 16px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-weight:600;cursor:pointer}
.done input{width:20px;height:20px;accent-color:var(--accent)}
.pager{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:28px}
.btn{font:inherit;font-size:15px;font-weight:600;display:inline-flex;align-items:center;gap:6px;padding:10px 16px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);text-decoration:none;cursor:pointer;max-width:100%}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:hover{filter:brightness(.97)}

/* prova */
.q{border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:14px 16px;margin:14px 0;min-width:0}
.q legend{float:left;width:100%;font-weight:600;padding:0;margin-bottom:8px;line-height:1.45}
.q legend+*{clear:both}
.q.open>label{display:block;font-weight:600;line-height:1.45}
.qn{font-family:var(--f-mono);font-size:13px;color:var(--accent);margin-right:6px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:6px 8px;border-radius:6px;cursor:pointer}
.opt:hover{background:var(--accent-soft)}
.opt input{margin-top:5px;accent-color:var(--accent);flex:0 0 auto}
.q textarea{width:100%;margin-top:10px;font:inherit;font-size:16px;padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);resize:vertical}
.q.right{border-color:var(--ok);box-shadow:inset 4px 0 0 var(--ok)}
.q.wrong{border-color:var(--warn);box-shadow:inset 4px 0 0 var(--warn)}
.q .fb{margin:10px 0 0;padding:8px 12px;border-radius:6px;background:var(--accent-soft);font-size:15px}
.q.wrong .fb{background:var(--warn-soft)}
.exam-actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:20px}
.score{margin-top:20px;padding:18px 20px;border-radius:10px;border:2px solid var(--accent);background:var(--surface)}
.score b{font-family:var(--f-display);font-size:30px;font-variant-numeric:tabular-nums}

@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
  .topbar{display:flex;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;align-items:center;justify-content:space-between;gap:12px;background:var(--surface);border-bottom:1px solid var(--line);
    padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .topbar b{font-family:var(--f-display);font-size:18px}
  .rail{display:none;position:static;height:auto;border-right:0;border-bottom:1px solid var(--line);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .app.menu-open .rail{display:block}
  main{padding-block:24px 48px}
  body{font-size:16px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="app" id="app">
  <header class="topbar"><b>Personal Chef Pro</b><button class="btn" id="menu-btn" aria-expanded="false" aria-controls="rail">Aulas</button></header>
  <aside class="rail" id="rail">
    <div class="brand"><b>Personal Chef Pro</b><span>Da cozinha ao negócio · 6 módulos · 24 aulas · 23 h</span></div>
    <div class="progress"><div class="progress-bar"><i id="pbar"></i></div><small id="ptext">0 de {{NLESSONS}} aulas concluídas</small></div>
    {{NAV}}
  </aside>
  <main id="main">
    {{BODY}}
  </main>
</div>

<script>
(function(){
  var LESSONS = {{LESSONS}};
  var store = {
    get: function(k, d){ try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch(e){ return d; } },
    set: function(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
  };
  var sections = Array.prototype.slice.call(document.querySelectorAll("section[data-sec]"));
  var ids = sections.map(function(s){ return s.id; });
  var links = document.querySelectorAll(".nav-group a");
  var app = document.getElementById("app");
  var menuBtn = document.getElementById("menu-btn");

  function show(id){
    if (ids.indexOf(id) < 0) id = "inicio";
    sections.forEach(function(s){ s.hidden = s.id !== id; });
    links.forEach(function(a){ a.classList.toggle("active", a.dataset.id === id); });
    app.classList.remove("menu-open"); menuBtn.setAttribute("aria-expanded", "false");
    window.scrollTo(0, 0);
    var act = document.querySelector('.nav-group a.active'); if (act && act.scrollIntoView) act.scrollIntoView({block:"nearest"});
  }
  window.addEventListener("hashchange", function(){ show(location.hash.slice(1)); });
  menuBtn.addEventListener("click", function(){
    var open = app.classList.toggle("menu-open"); menuBtn.setAttribute("aria-expanded", open ? "true" : "false");
  });

  // progresso das aulas
  var done = store.get("pcp-done", {});
  function paint(){
    var n = LESSONS.filter(function(id){ return done[id]; }).length;
    document.getElementById("pbar").style.width = (100 * n / LESSONS.length) + "%";
    document.getElementById("ptext").textContent = n + " de " + LESSONS.length + " aulas concluídas";
    links.forEach(function(a){ a.classList.toggle("is-done", !!done[a.dataset.id]); });
  }
  document.querySelectorAll(".done-chk").forEach(function(c){
    c.checked = !!done[c.dataset.id];
    c.addEventListener("change", function(){ done[c.dataset.id] = c.checked; store.set("pcp-done", done); paint(); });
  });
  paint();

  // checklists
  var checks = store.get("pcp-checks", {});
  sections.forEach(function(s){
    s.querySelectorAll(".chk").forEach(function(c, i){
      var key = s.id + ":" + i; c.checked = !!checks[key];
      c.addEventListener("change", function(){ checks[key] = c.checked; store.set("pcp-checks", checks); });
    });
  });

  // gabaritos ocultos nos quizzes das aulas
  document.querySelectorAll('section[data-kind="lesson"] strong').forEach(function(st){
    if (!/^Gabarito/.test(st.textContent)) return;
    var wrap = document.createElement("span"); wrap.className = "answer"; wrap.hidden = true;
    st.parentNode.insertBefore(wrap, st);
    var n = st;
    while (n) { var next = n.nextSibling; if (n.nodeName === "UL" || n.nodeName === "OL") break; wrap.appendChild(n); n = next; }
    var btn = document.createElement("button"); btn.type = "button"; btn.className = "answer-btn"; btn.textContent = "Ver resposta";
    btn.setAttribute("aria-expanded", "false");
    btn.addEventListener("click", function(){ wrap.hidden = !wrap.hidden; btn.textContent = wrap.hidden ? "Ver resposta" : "Ocultar resposta"; btn.setAttribute("aria-expanded", wrap.hidden ? "false" : "true"); });
    wrap.parentNode.insertBefore(btn, wrap);
  });

  // prova final
  var exam = document.getElementById("exam");
  if (exam) {
    var saved = store.get("pcp-exam", {});
    exam.querySelectorAll("input[type=radio]").forEach(function(r){ if (saved[r.name] === r.value) r.checked = true; });
    exam.querySelectorAll("textarea").forEach(function(t){ if (saved[t.id]) t.value = saved[t.id]; });
    exam.addEventListener("change", function(e){ var t = e.target; if (t.name) { saved[t.name] = t.value; store.set("pcp-exam", saved); } });
    exam.addEventListener("input", function(e){ var t = e.target; if (t.tagName === "TEXTAREA") { saved[t.id] = t.value; store.set("pcp-exam", saved); } });
    exam.addEventListener("submit", function(e){
      e.preventDefault();
      var qs = exam.querySelectorAll("fieldset.q"), right = 0, blank = 0;
      qs.forEach(function(f){
        var sel = f.querySelector("input:checked");
        var ok = sel && sel.value === f.dataset.ans;
        if (!sel) blank++;
        if (ok) right++;
        f.classList.toggle("right", !!ok); f.classList.toggle("wrong", !ok);
        f.querySelector(".fb").hidden = false;
      });
      exam.querySelectorAll(".q.open .fb").forEach(function(p){ p.hidden = false; });
      var sc = document.getElementById("score");
      sc.hidden = false;
      sc.innerHTML = "<b>" + right + " / " + qs.length + "</b> nas questões objetivas" +
        (blank ? " (" + blank + " em branco)" : "") +
        "<p>Some a sua nota nas 5 situacionais (0, 0,5 ou 1 ponto cada) usando os critérios mostrados abaixo de cada uma. Aprovação: 21 pontos de 30.</p>" +
        "<p>" + (right >= 21 ? "Você já atingiu a nota mínima só com as objetivas." : (21 - right <= 5 ? "Faltam " + (21 - right) + " pontos para a aprovação; as situacionais podem completar até 5." : "Mesmo com as 5 situacionais a nota mínima não é alcançada. Revise as aulas indicadas nas questões erradas e refaça a prova.")) + "</p>";
      sc.scrollIntoView({block:"center"});
    });
    document.getElementById("exam-reset").addEventListener("click", function(){
      exam.reset(); saved = {}; store.set("pcp-exam", saved);
      exam.querySelectorAll(".q").forEach(function(f){ f.classList.remove("right","wrong"); var fb = f.querySelector(".fb"); if (fb) fb.hidden = true; });
      document.getElementById("score").hidden = true;
    });
  }

  show(location.hash.slice(1));
})();
</script>
