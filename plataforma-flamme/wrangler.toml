# Plataforma Flamme — Cloudflare Workers (conta própria da Flamme)
name = "plataforma-flamme"
main = "src/index.js"
compatibility_date = "2025-09-01"
# mantém as variáveis criadas no painel a cada novo deploy
keep_vars = true

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
not_found_handling = "single-page-application"

# Banco de dados D1 "plataforma-flamme" (conta da Flamme)
[[d1_databases]]
binding = "DB"
database_name = "plataforma-flamme"
database_id = "a652935d-9ad7-4707-b0cd-adc21c921836"

# Arquivos (artes, vídeos, estratégias em PDF)
[[r2_buckets]]
binding = "MIDIA"
bucket_name = "plataforma-flamme-midia"

# A cada 5 min: publica agendados, lembretes, atualiza os perfis. Todo dia 12h UTC (9h Brasília): prazos, tokens, limpeza.
[triggers]
crons = ["*/5 * * * *", "0 12 * * *"]

[vars]
GRAPH_VERSION = "v23.0"
# IG_APP_ID = "ID do app do Instagram (não é segredo)"

# Segredos (painel do Worker → Settings → Variables and Secrets, tipo "Secret"):
#   ANTHROPIC_API_KEY -> chave da API do Claude (IA da plataforma)
#   IG_APP_SECRET     -> chave secreta do app do Instagram
#   API_TOKEN         -> opcional, para o Claude operar a plataforma pela API

[observability]
enabled = true
