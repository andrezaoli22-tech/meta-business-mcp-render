<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260" font-family="Arial, Helvetica, sans-serif">
  <rect width="900" height="260" fill="#ffffff"/>
  <text x="450" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#1f2937">O ciclo do atendimento do personal chef</text>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
  </defs>
  <g font-size="14" text-anchor="middle">
    <rect x="20" y="80" width="120" height="80" rx="12" fill="#e0f2fe" stroke="#0284c7"/>
    <text x="80" y="115" font-weight="bold" fill="#075985">1. Entrevista</text>
    <text x="80" y="137" fill="#075985">gostos, alergias</text>

    <rect x="168" y="80" width="120" height="80" rx="12" fill="#ede9fe" stroke="#7c3aed"/>
    <text x="228" y="115" font-weight="bold" fill="#5b21b6">2. Proposta</text>
    <text x="228" y="137" fill="#5b21b6">cardápio + preço</text>

    <rect x="316" y="80" width="120" height="80" rx="12" fill="#dcfce7" stroke="#16a34a"/>
    <text x="376" y="115" font-weight="bold" fill="#166534">3. Compras</text>
    <text x="376" y="137" fill="#166534">perecíveis por último</text>

    <rect x="464" y="80" width="120" height="80" rx="12" fill="#fef3c7" stroke="#d97706"/>
    <text x="524" y="115" font-weight="bold" fill="#92400e">4. Cook day</text>
    <text x="524" y="137" fill="#92400e">produção em lote</text>

    <rect x="612" y="80" width="120" height="80" rx="12" fill="#fee2e2" stroke="#dc2626"/>
    <text x="672" y="108" font-weight="bold" fill="#991b1b">5. Porcionar,</text>
    <text x="672" y="126" font-weight="bold" fill="#991b1b">rotular, limpar</text>
    <text x="672" y="146" fill="#991b1b">geladeira organizada</text>

    <rect x="760" y="80" width="120" height="80" rx="12" fill="#f3f4f6" stroke="#4b5563"/>
    <text x="820" y="115" font-weight="bold" fill="#1f2937">6. Feedback</text>
    <text x="820" y="137" fill="#1f2937">D+2, ajustar</text>
  </g>
  <g stroke="#6b7280" stroke-width="2" marker-end="url(#a)">
    <line x1="140" y1="120" x2="166" y2="120"/>
    <line x1="288" y1="120" x2="314" y2="120"/>
    <line x1="436" y1="120" x2="462" y2="120"/>
    <line x1="584" y1="120" x2="610" y2="120"/>
    <line x1="732" y1="120" x2="758" y2="120"/>
  </g>
  <path d="M820,160 C820,230 80,230 80,162" fill="none" stroke="#6b7280" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#a)"/>
  <text x="450" y="245" text-anchor="middle" font-size="13" fill="#4b5563">recorrência: o feedback alimenta o próximo cardápio</text>
</svg>
