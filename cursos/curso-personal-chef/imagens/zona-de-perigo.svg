<svg xmlns="http://www.w3.org/2000/svg" width="640" height="460" viewBox="0 0 640 460" font-family="Arial, Helvetica, sans-serif">
  <rect width="640" height="460" fill="#ffffff"/>
  <text x="320" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#1f2937">Zona de perigo e temperaturas de referência</text>
  <!-- termometro -->
  <rect x="90" y="60" width="60" height="360" rx="30" fill="#f3f4f6" stroke="#9ca3af" stroke-width="2"/>
  <rect x="100" y="70" width="40" height="80" rx="8" fill="#b91c1c"/>
  <rect x="100" y="150" width="40" height="190" fill="#f59e0b"/>
  <rect x="100" y="340" width="40" height="70" rx="8" fill="#2563eb"/>
  <!-- marcas -->
  <g font-size="15" fill="#111827">
    <line x1="150" y1="100" x2="190" y2="100" stroke="#111827"/>
    <text x="198" y="105">≥ 70 °C — cocção (centro do alimento)</text>
    <line x1="150" y1="150" x2="190" y2="150" stroke="#111827"/>
    <text x="198" y="155">&gt; 60 °C — manter quente (máx. 6 h)</text>
    <line x1="150" y1="290" x2="190" y2="290" stroke="#111827"/>
    <text x="198" y="295">≤ 10 °C — frio na distribuição (máx. 4 h)</text>
    <line x1="150" y1="340" x2="190" y2="340" stroke="#111827"/>
    <text x="198" y="345">&lt; 5 °C — refrigeração (preparados: ≤ 4 °C)</text>
    <line x1="150" y1="400" x2="190" y2="400" stroke="#111827"/>
    <text x="198" y="405">≤ −18 °C — congelamento</text>
  </g>
  <rect x="198" y="185" width="400" height="70" rx="10" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="398" y="215" text-anchor="middle" font-size="18" font-weight="bold" fill="#92400e">ZONA DE PERIGO: 5 °C a 60 °C</text>
  <text x="398" y="240" text-anchor="middle" font-size="14" fill="#92400e">microrganismos se multiplicam rapidamente</text>
  <text x="320" y="448" text-anchor="middle" font-size="11" fill="#6b7280">Referência: RDC 216/2004 (ANVISA) e cartilhas de boas práticas — conferir texto vigente. Resfriar de 60 °C a 10 °C em até 2 h.</text>
</svg>
