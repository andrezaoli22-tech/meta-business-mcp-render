<svg xmlns="http://www.w3.org/2000/svg" width="820" height="300" viewBox="0 0 820 300" font-family="Arial, Helvetica, sans-serif">
  <rect width="820" height="300" fill="#ffffff"/>
  <text x="410" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#1f2937">Cortes clássicos (medidas aproximadas)</text>
  <g fill="#fb923c" stroke="#c2410c">
    <!-- julienne -->
    <rect x="50" y="90" width="6" height="100"/><rect x="62" y="90" width="6" height="100"/><rect x="74" y="90" width="6" height="100"/>
    <!-- brunoise -->
    <rect x="180" y="130" width="10" height="10"/><rect x="196" y="130" width="10" height="10"/><rect x="212" y="130" width="10" height="10"/>
    <rect x="188" y="146" width="10" height="10"/><rect x="204" y="146" width="10" height="10"/>
    <!-- batonnet -->
    <rect x="310" y="90" width="14" height="100"/><rect x="332" y="90" width="14" height="100"/>
    <!-- cubos pequenos -->
    <rect x="450" y="125" width="18" height="18"/><rect x="474" y="125" width="18" height="18"/><rect x="462" y="149" width="18" height="18"/>
    <!-- cubos medios -->
    <rect x="580" y="115" width="32" height="32"/><rect x="620" y="115" width="32" height="32"/><rect x="600" y="153" width="32" height="32"/>
  </g>
  <g fill="#16a34a">
    <path d="M720 120 q30 -20 60 0 q-30 8 -60 0z"/><path d="M720 140 q30 -20 60 0 q-30 8 -60 0z"/><path d="M720 160 q30 -20 60 0 q-30 8 -60 0z"/>
  </g>
  <g font-size="15" text-anchor="middle" fill="#111827">
    <text x="65" y="225" font-weight="bold">Julienne</text><text x="65" y="245">3×3 mm × 5 cm</text>
    <text x="200" y="225" font-weight="bold">Brunoise</text><text x="200" y="245">cubos ~3 mm</text>
    <text x="328" y="225" font-weight="bold">Bâtonnet</text><text x="328" y="245">6×6 mm × 6 cm</text>
    <text x="470" y="225" font-weight="bold">Cubo pequeno</text><text x="470" y="245">~6 mm</text>
    <text x="616" y="225" font-weight="bold">Cubo médio</text><text x="616" y="245">~12 mm</text>
    <text x="750" y="225" font-weight="bold">Chiffonade</text><text x="750" y="245">tiras de folhas</text>
  </g>
  <text x="410" y="285" text-anchor="middle" font-size="11" fill="#6b7280">Ilustração fora de escala. Referência: listas de cortes culinários (Rouxbe; Wikipedia).</text>
</svg>
