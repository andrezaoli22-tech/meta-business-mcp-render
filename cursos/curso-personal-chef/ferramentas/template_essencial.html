<title>Personal Chef Pro</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: uma folha única de leitura, como uma apostila de cozinha; módulos marcados por etiqueta de comanda. */
:root{--bg:#F3F6F2;--surface:#FFFFFF;--ink:#16201A;--muted:#56655C;--line:#D5DED7;--accent:#2E6A4E;--accent-soft:#E1EEE6;
--f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;--f-body:"Source Sans 3","Segoe UI",system-ui,sans-serif;--f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1512;--surface:#161E1A;--ink:#E4EBE6;--muted:#9BAAA1;--line:#2A3630;--accent:#7FC3A1;--accent-soft:#1C2E25;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0F1512;--surface:#161E1A;--ink:#E4EBE6;--muted:#9BAAA1;--line:#2A3630;--accent:#7FC3A1;--accent-soft:#1C2E25;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.6;
 padding-block:40px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main{max-width:760px;margin:0 auto}
a{color:var(--accent);overflow-wrap:anywhere}
h1,h2{font-family:var(--f-display);line-height:1.2;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:clamp(30px,5vw,42px);margin:0 0 10px}
h2{font-size:25px;margin:44px 0 12px;padding-top:16px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 12px}
.mod{font-family:var(--f-mono);font-size:13px;font-weight:500;letter-spacing:.04em;text-transform:uppercase;color:var(--accent);border:1.5px dashed var(--accent);border-radius:4px;padding:2px 8px}
p,li{max-width:68ch}
li{margin:4px 0}
blockquote{margin:16px 0;padding:10px 16px;border-left:3px solid var(--accent);background:var(--accent-soft);border-radius:0 8px 8px 0;font-size:15px}
blockquote p{margin:4px 0}
code{font-family:var(--f-mono);font-size:.85em;background:var(--accent-soft);padding:1px 5px;border-radius:4px}
.table-wrap{overflow-x:auto;margin:14px 0;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:15px;line-height:1.45}
th,td{padding:8px 12px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
th{background:var(--accent-soft)}
tr:last-child td{border-bottom:0}
.gab{margin:16px 0;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:10px 14px}
.gab summary{cursor:pointer;font-weight:700;color:var(--accent)}
.gab p{font-family:var(--f-mono);font-size:15px;margin:8px 0 0}
summary:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
@media print{body{background:#fff;font-size:10.5pt;padding:0}h2{break-after:avoid;margin-top:22px}.table-wrap,tr{break-inside:avoid}}
</style>
<main>
{{BODY}}
</main>
