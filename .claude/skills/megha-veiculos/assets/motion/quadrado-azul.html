<!DOCTYPE html>
<html><head><meta charset="utf-8">
<!-- Quadrado azul de vidro (estilo botão brilhante) que surge atrás da cabeça e recebe texto
     digitando na faixa de cima. Feito para a camada "atrás da pessoa" (montar.py com profundidade).
     Parâmetros: cx, cy (centro, frações), lado (fração da largura), linhas [..], duracao -->
<style>
/*__FONTES__*/
html,body{margin:0;background:transparent;overflow:hidden;width:100vw;height:100vh}
#q{position:absolute;border-radius:16%;overflow:hidden;
  background:linear-gradient(180deg,#2A52F5 0%,#1532D6 38%,#0A27C4 62%,#1E5BFF 100%);
  border:calc(var(--u)*.7) solid #3E7BFF;
  box-shadow:0 calc(var(--u)*2.4) calc(var(--u)*6) rgba(0,10,80,.55), inset 0 0 calc(var(--u)*3) rgba(120,170,255,.55)}
#brilho{position:absolute;left:4%;right:4%;top:2.5%;height:33%;border-radius:40% 40% 50% 50% / 30% 30% 70% 70%;
  background:linear-gradient(180deg,rgba(255,255,255,.78),rgba(255,255,255,.18))}
#reflexo{position:absolute;top:-30%;bottom:-30%;width:30%;background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.35),rgba(255,255,255,0));transform:skewX(-20deg)}
#txt{position:absolute;left:0;right:0;top:9%;text-align:center;color:#fff}
.ln{white-space:nowrap;line-height:1.02;text-shadow:0 calc(var(--u)*.4) calc(var(--u)*1.6) rgba(0,10,90,.5)}
.ln0{font-family:"Poppins",sans-serif;font-weight:900;font-size:calc(var(--u)*11);letter-spacing:-.04em}
.ln1{font-family:"Montserrat Alternates",sans-serif;font-weight:500;font-size:calc(var(--u)*5.4);letter-spacing:-.04em;margin-top:calc(var(--u)*.6)}
#cur{display:inline-block;width:.07em;height:.8em;background:#fff;margin-left:.04em;vertical-align:-.05em;box-shadow:0 0 12px rgba(255,255,255,.9)}
</style></head><body>
<div id="q"><div id="brilho"></div><div id="reflexo"></div><div id="txt"></div></div>
<script>window.PARAMS=/*__PARAMS__*/{};window.PADRAO={cx:.5,cy:.3,lado:.62,linhas:["FEIRÃO BV","+ Megha Veículos"],duracao:2};</script>
<script>/*__BASE__*/</script>
<script>
const P=M.P,W=innerWidth,H=innerHeight;
document.documentElement.style.setProperty('--u',(W/100)+'px');
const q=document.getElementById('q'),txt=document.getElementById('txt'),ref=document.getElementById('reflexo');
const L=P.lado*W; q.style.width=q.style.height=L+'px'; q.style.left=(P.cx*W-L/2)+'px'; q.style.top=(P.cy*H-L/2)+'px';
const linhas=P.linhas.map((s,i)=>{const d=document.createElement('div');d.className='ln ln'+Math.min(i,1);txt.appendChild(d);return {d,s};});
const cur=document.createElement('span');cur.id='cur';
const total=P.linhas.join('').length;
window.PRONTO=document.fonts.ready.then(()=>{
  // garante que cada linha cabe no quadrado
  linhas.forEach(({d,s})=>{d.textContent=s;const w=d.getBoundingClientRect().width;
    if(w>L*.86) d.style.fontSize=(parseFloat(getComputedStyle(d).fontSize)*L*.86/w)+'px';d.textContent='';});
  renderFrame(0);});
window.renderFrame=t=>{
  const D=DURACAO, e=M.p(t,0,.5), s=M.cubicIn(M.clamp((t-(D-.3))/.3));
  q.style.opacity=(Math.min(1,e*1.6)*(1-s)).toFixed(3);
  q.style.transform=`scale(${(.55+.45*e+.03*t/D-s*.08).toFixed(4)}) rotate(${((1-e)*-9).toFixed(2)}deg)`;
  ref.style.left=(-40+170*M.clamp((t-.35)/.8))+'%';
  // digitação: começa depois que o quadrado assenta
  const t0=.42, passo=Math.min(.055,(D-t0-.5)/Math.max(1,total));
  let n=Math.max(0,Math.floor((t-t0)/passo)), resto=n;
  linhas.forEach(({d,s})=>{const k=Math.min(s.length,resto);d.textContent=s.slice(0,k);resto-=k;});
  cur.remove();
  const alvo=linhas.find(({d,s})=>d.textContent.length<s.length)||linhas[linhas.length-1];
  if(t>=t0) alvo.d.appendChild(cur);
  cur.style.opacity=(n>=total? (Math.floor((t-t0-total*passo)/.25)%2===0?1:0):1);
};
</script></body></html>
